# Declares the live preprocessing pipeline (what run_pipeline / make preprocess runs).
# Skipped original-plan steps are listed under skipped for audit only.

pipeline:
  steps:
    - id: reextract
      module: src.preprocessing.reextract_pdfs
      description: "Re-extract Hindi PDFs with Tesseract OCR (default) or pdftotext"
      input: data/hindi/original/
      output: data/hindi/preprocessed/
      tool: tesseract
      corrupted_docs: [6, 14, 22, 25, 26]

    - id: join
      module: src.preprocessing.join_lines
      description: "Join hard-wrapped lines in English clean docs"
      input: data/english/clean/
      output: data/english/preprocessed/

    - id: segment
      module: src.preprocessing.segment_sentences
      description: "Sentence segmentation (spaCy EN, danda HI)"
      input:
        english: data/english/preprocessed/
        hindi: data/hindi/preprocessed/
      output:
        english: data/english/segmented/
        hindi: data/hindi/segmented/

    - id: align
      module: src.preprocessing.align_sentences
      description: "LaBSE mutual-best alignment + quality filters"
      input:
        english: data/english/segmented/
        hindi: data/hindi/segmented/
      output: data/aligned/all.jsonl

    - id: output
      module: src.preprocessing.output_format
      description: "Document-level train/dev/test JSONL + metadata"
      input: data/aligned/all.jsonl
      output: data/processed/

  skipped:
    - name: strip_utf8_bom
      reason: "preprocessed Hindi has no BOM; pipeline never reads BOM-bearing clean/ as source of truth"
    - name: normalize_line_endings
      reason: "preprocessed is LF-only; Python text mode normalizes CRLF on read"
    - name: fix_ocr_roman_numerals
      reason: "zero li./lili. artifacts in corpus; naive fix false-positives on legal L."
    - name: paragraph_segmentation
      reason: "blank lines already separate paragraphs after join/OCR"

paths:
  data_dir: data/
  english_original: data/english/original/
  english_clean: data/english/clean/
  english_preprocessed: data/english/preprocessed/
  english_segmented: data/english/segmented/
  hindi_original: data/hindi/original/
  hindi_clean: data/hindi/clean/
  hindi_preprocessed: data/hindi/preprocessed/
  hindi_segmented: data/hindi/segmented/
  aligned: data/aligned/
  processed: data/processed/

# Must match constants in src/preprocessing/align_sentences.py
alignment:
  model: sentence-transformers/LaBSE
  method: mutual_best_greedy
  min_similarity: 0.5
  char_ratio_min: 0.3
  char_ratio_max: 3.0
  min_text_length: 3
  dedup_jaccard: 0.85

# Must match src/preprocessing/output_format.py
splits:
  seed: 42
  train_frac: 0.8
  dev_frac: 0.1
  test_frac: 0.1
  level: document

validation:
  devanagari:
    start_unicode: "U+0900"
    end_unicode: "U+097F"
    min_chars: 1
    hindi_threshold: 0.3
